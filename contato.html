<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato - DevCafé</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f5f5f5;
    }

    .container {
      max-width: 800px;
      margin: 60px auto;
      padding: 20px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
    }

    p {
      color: #666;
      margin-bottom: 30px;
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .social-links a {
      text-decoration: none;
      color: #fff;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
      transition: 0.3s;
    }

    .instagram { background-color: #E1306C; }
    .linkedin { background-color: #0077B5; }
    .github { background-color: #333; }
    .whatsapp { background-color: #25D366; }

    .social-links a:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Entre em Contato</h1>
    <p>Conecte-se com o DevCafé pelas redes sociais</p>

    <div class="social-links">
      <a href="https://instagram.com/seuusuario" target="_blank" class="instagram">
        Instagram
      </a>

      <a href="https://linkedin.com/in/seuusuario" target="_blank" class="linkedin">
        LinkedIn
      </a>

      <a href="https://github.com/seuusuario" target="_blank" class="github">
        GitHub
      </a>

      <a href="https://wa.me/5599999999999" target="_blank" class="whatsapp">
        WhatsApp
      </a>
    </div>
  </div>

</body>
</html>
